name: Weekly dashboard refresh

on:
  schedule:
    # Two attempts on Mondays, aimed at 07:00 and 08:00 Berlin time (roughly
    # 05:00/06:00 UTC depending on DST). GitHub Actions schedules can fire
    # minutes to hours late under load - on 2026-09-28 both attempts fired
    # around 6 hours late - so this no longer relies on firing at a precise
    # time. Whichever attempt actually runs first does the refresh; the
    # "already refreshed today" guard below makes the other one a no-op
    # instead of a duplicate or a silent skip.
    - cron: "0 5 * * 1"
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already refreshed today (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Europe/Berlin date +%F)"
          last_msg="$(git log -1 --format=%s)"
          if [ "$last_msg" = "chore: weekly dashboard refresh $today" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Already refreshed today ($today, commit: $last_msg) - skipping this duplicate scheduled run."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 20

      - name: Generate dashboard from SharePoint
        if: steps.guard.outputs.go == 'true'
        run: node generate.js
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

      - name: Publish index.html if it changed
        if: steps.guard.outputs.go == 'true'
        run: |
          cp dist/index.html index.html
          if git diff --quiet -- index.html; then
            echo "No changes - dashboard already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: weekly dashboard refresh $(TZ=Europe/Berlin date +%F)"
          git push
